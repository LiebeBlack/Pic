name: Build and Release ARTPICST

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: powershell
        run: cmake -S . -B build -A x64

      - name: Build application
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Build updater executable
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python updater/build_exe.py

      - name: Validate executable exists
        shell: powershell
        run: |
          $candidates = @(
            Join-Path $env:GITHUB_WORKSPACE "build\bin\artpicst.exe"
            Join-Path $env:GITHUB_WORKSPACE "build\Release\artpicst.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "Executable not found"
          }
          Write-Host "Found: $exe"
          echo "ARTPICST_EXE=$exe" >> $env:GITHUB_ENV

      - name: Prepare release folder
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $icon = Join-Path $root "resources\artpicst.ico"
          $updaterExe = Join-Path $root "updater_build\auto_updater.exe"
          $distUpdaterExe = Join-Path $dist "auto_updater.exe"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          if (-not (Test-Path $icon)) {
            throw "Missing icon: $icon"
          }

          if (-not (Test-Path $updaterExe)) {
            throw "Updater EXE not found: $updaterExe"
          }

          Copy-Item $env:ARTPICST_EXE (Join-Path $dist "artpicst.exe") -Force
          Copy-Item $updaterExe $distUpdaterExe -Force
          Copy-Item (Join-Path $root "README.md") (Join-Path $dist "README.md") -Force
          Copy-Item $icon (Join-Path $dist "artpicst.ico") -Force

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Generate installer
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $out = Join-Path $root "artpicst-installer.exe"
          $nsis = "C:\Program Files (x86)\NSIS\Bin\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          & $nsis "/DOutFile=$out" "/DSourceDir=$dist" (Join-Path $root "scripts\artpicst-installer.nsi")
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed" }

      - name: Create portable ZIP
        shell: powershell
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artpicst-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -DestinationPath $zipPath -Force

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: artpicst-release
          path: |
            artpicst-portable.zip
            artpicst-installer.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('auto-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ARTPICST auto {0}', github.run_number) }}
          files: |
            artpicst-portable.zip
            artpicst-installer.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Show release summary
        shell: powershell
        run: |
          Write-Host "Release built successfully."
          Write-Host "Installer: $env:GITHUB_WORKSPACE\artpicst-installer.exe"
          Write-Host "Portable: $env:GITHUB_WORKSPACE\artpicst-portable.zip"

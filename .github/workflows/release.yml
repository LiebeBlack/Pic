name: Build and Release ARTPICST

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        shell: powershell
        run: |
          cmake --build build --config Release

      - name: Prepare release folder
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ""
          $dist = Join-Path $root "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exeSource = Join-Path $root "build\bin\artpicst.exe"
          $exeDest = Join-Path $dist "artpicst.exe"
          Copy-Item $exeSource $exeDest -Force

          Copy-Item (Join-Path $root "README.md") (Join-Path $dist "README.md") -Force

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y

      - name: Generate installer
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ""
          $dist = Join-Path $root "dist"
          $out = Join-Path $root "artpicst-installer.exe"
          $nsis = "C:\Program Files (x86)\NSIS\Bin\makensis.exe"
          & $nsis "/DOutFile=$out" "/DSourceDir=$dist" "$root\scripts\artpicst-installer.nsi"

      - name: Create portable ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "artpicst-portable.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artpicst-build
          path: |
            artpicst-portable.zip
            artpicst-installer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artpicst-portable.zip
            artpicst-installer.exe

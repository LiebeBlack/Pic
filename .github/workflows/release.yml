name: Build and Release ARTPICST

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja

      - name: Build application
        shell: powershell
        run: |
          $env:CMAKE_BUILD_PARALLEL_LEVEL = 4
          cmake --build build --config Release --parallel 4

      - name: Validate executable exists
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\bin\artpicst.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }
          Write-Host "Found: $exe"

      - name: Prepare release folder
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exeSource = Join-Path $root "build\bin\artpicst.exe"
          $exeDest = Join-Path $dist "artpicst.exe"
          Copy-Item $exeSource $exeDest -Force

          Copy-Item (Join-Path $root "README.md") (Join-Path $dist "README.md") -Force

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress

      - name: Generate installer
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $out = Join-Path $root "artpicst-installer.exe"
          $nsis = "C:\Program Files (x86)\NSIS\Bin\makensis.exe"

          if (-not (Test-Path $nsis)) {
            throw "NSIS not found at $nsis"
          }

          & $nsis "/DOutFile=$out" "/DSourceDir=$dist" (Join-Path $root "scripts\artpicst-installer.nsi")

      - name: Create portable ZIP
        shell: powershell
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artpicst-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -DestinationPath $zipPath -Force

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: artpicst-release
          path: |
            artpicst-portable.zip
            artpicst-installer.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('auto-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ARTPICST auto {0}', github.run_number) }}
          files: |
            artpicst-portable.zip
            artpicst-installer.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true

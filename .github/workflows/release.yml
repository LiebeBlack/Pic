name: Build and Release ARTPICST

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generar icono multirresolucion
        run: python scripts/generate_icon.py

      - name: Compilar recursos
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist dist mkdir dist
          rc /nologo /fo build\artpicst.res artpicst.rc || exit /b 1
          cd installer
          rc /nologo /fo ..\build\artpicst_installer.res artpicst_installer.rc || exit /b 1

      - name: Compilar ARTPICST (C++23)
        shell: cmd
        run: |
          cd src
          cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /GL /Gy /utf-8 /W4 /WX- /I. /I..\include ^
            /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DSTBI_WINDOWS_UTF8 /D_WIN32_WINNT=0x0601 ^
            /Fe:"..\build\artpicst.exe" main.cpp ..\build\artpicst.res ^
            /link gdiplus.lib user32.lib kernel32.lib shell32.lib shlwapi.lib gdi32.lib msimg32.lib ^
                  ole32.lib oleaut32.lib uuid.lib dwmapi.lib windowscodecs.lib comdlg32.lib d2d1.lib dwrite.lib ^
            /MANIFESTINPUT:..\artpicst.manifest /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF || exit /b 1
          cd ..

      - name: Compilar instalador (C++23, requiere administrador)
        shell: cmd
        run: |
          cd installer
          cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /utf-8 /W4 /WX- /I. /I..\include ^
            /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 ^
            /Fe:"..\build\artpicst_installer.exe" artpicst_installer.cpp ..\build\artpicst_installer.res ^
            /link gdiplus.lib shlwapi.lib shell32.lib comctl32.lib dwmapi.lib user32.lib advapi32.lib ^
                  gdi32.lib ole32.lib uuid.lib ^
            /SUBSYSTEM:WINDOWS "/MANIFESTUAC:level='requireAdministrator' uiAccess='false'" ^
            /OPT:REF /OPT:ICF || exit /b 1
          cd ..

      - name: Validar ejecutables
        shell: powershell
        run: |
          foreach ($exe in @("build\artpicst.exe", "build\artpicst_installer.exe")) {
            if (-not (Test-Path $exe)) { throw "Falta el ejecutable: $exe" }
            Write-Host "$exe : $((Get-Item $exe).Length) bytes"
          }
          echo "ARTPICST_EXE=$(Resolve-Path build\artpicst.exe)" >> $env:GITHUB_ENV
          echo "ARTPICST_INSTALLER=$(Resolve-Path build\artpicst_installer.exe)" >> $env:GITHUB_ENV

      - name: Preparar carpeta de release
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $icon = Join-Path $root "resources\artpicst.ico"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "auto-$env:GITHUB_RUN_NUMBER" }

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          if (-not (Test-Path $icon)) { throw "Missing icon: $icon" }

          Copy-Item $env:ARTPICST_EXE (Join-Path $dist "artpicst.exe") -Force
          Copy-Item $env:ARTPICST_INSTALLER (Join-Path $dist "artpicst_installer.exe") -Force
          Copy-Item (Join-Path $root "README.md") (Join-Path $dist "README.md") -Force
          Copy-Item $icon (Join-Path $dist "artpicst.ico") -Force
          if (Test-Path (Join-Path $root "docs\REFACTOR_C23.md")) {
            Copy-Item (Join-Path $root "docs\REFACTOR_C23.md") (Join-Path $dist "REFACTOR_C23.md") -Force
          }

          $versionInfo = @{
            version = $tag
            tag = $tag
            build = [int]$env:GITHUB_RUN_NUMBER
            build_date = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dist "version.json") -Value $versionInfo -Encoding UTF8

      - name: Instalar NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Generar instalador NSIS
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $out = Join-Path $root "artpicst-installer.exe"
          $nsis = "C:\Program Files (x86)\NSIS\Bin\makensis.exe"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "auto-$env:GITHUB_RUN_NUMBER" }
          if (-not (Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          & $nsis "/DOutFile=$out" "/DSourceDir=$dist" "/DAPP_VERSION=$tag" (Join-Path $root "scripts\artpicst-installer.nsi")
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed" }

      - name: Crear ZIP portable
        shell: powershell
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "ARTPICST-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -DestinationPath $zipPath -Force

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: artpicst-release
          path: |
            ARTPICST-windows-x64.zip
            artpicst-installer.exe
          if-no-files-found: error

      - name: Publicar release en GitHub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('auto-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ARTPICST auto {0}', github.run_number) }}
          files: |
            ARTPICST-windows-x64.zip
            artpicst-installer.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Resumen
        shell: powershell
        run: |
          Write-Host "Release built successfully."
          Write-Host "Installer: $env:GITHUB_WORKSPACE\artpicst-installer.exe"
          Write-Host "Portable: $env:GITHUB_WORKSPACE\ARTPICST-windows-x64.zip"

name: Build and Release ARTPICST

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Definir versión (fecha UTC: auto-<run>-YYYYMMDD)"
        shell: powershell
        run: |
          # Esquema estandarizado: los builds de la linea continua usan
          # auto-<run>-YYYYMMDD (UTC) - sin "Latest-80.X" ni "auto-80" simple.
          # Los tags v* manuales se respetan tal cual.
          # Se escribe con AppendAllText (UTF-8 sin BOM) y NO con ">>": el
          # append de PS 5.1 es UTF-16LE y corrompe GITHUB_ENV si un paso
          # previo (p. ej. una accion de Node) ya creo el fichero en UTF-8.
          # Ademas, $(Get-Date).ToUniversalTime() cerraba la subexpresion en
          # Get-Date y partia la linea en varias -> "Invalid format" del runner.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $nowUtc = (Get-Date).ToUniversalTime()
          $stamp = $nowUtc.ToString("yyyyMMdd")
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "auto-$env:GITHUB_RUN_NUMBER-$stamp" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARTPICST_TAG=$tag`n", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARTPICST_DATE=$($nowUtc.ToString('yyyy-MM-dd HH:mm:ss')) UTC`n", $utf8)

      # GATE DE VERSIÓN: version.json, installer/version.hpp y los recursos
      # VERSIONINFO de los tres .rc deben declarar EXACTAMENTE la misma
      # versión. Una discrepancia aborta el release antes de compilar.
      - name: Verificar consistencia de versión
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $versions = @{}
          $versions["version.json"] = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $versions["installer/version.hpp"] = if ((Get-Content installer/version.hpp -Raw) -match 'kAppVersion\s*=\s*L"([^"]+)"') { $Matches[1] } else { "" }
          $rcFiles = @("artpicst.rc", "updater/artpicst_updater.rc", "installer/artpicst_installer.rc", "installer/artpicst_installer.rc.in")
          foreach ($rc in $rcFiles) {
            $content = Get-Content $rc -Raw
            $versions[$rc] = if ($content -match 'VALUE "FileVersion", "([^"]+)"') { $Matches[1] } else { "" }
          }
          $expected = $versions["version.json"]
          $bad = @()
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $expected) { $bad += "$($entry.Key) = '$($entry.Value)'" }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::Discrepancia de version (version.json = '$expected'):"
            $bad | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }
          Write-Host "Version consistente en todos los ficheros: $expected" -ForegroundColor Green

      - name: Generar icono multirresolucion
        run: python scripts/generate_icon.py

      - name: Compilar recursos
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist dist mkdir dist
          if not exist installer\build mkdir installer\build
          if not exist updater\build mkdir updater\build
          rc /nologo /fo build\artpicst.res artpicst.rc || exit /b 1
          cd updater
          rc /nologo /fo ..\build\artpicst_updater.res artpicst_updater.rc || exit /b 1
          REM El .rc del instalador se compila en su paso, DESPUES del payload.

      - name: Compilar ARTPICST (C++23)
        shell: cmd
        run: |
          cd src
          cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /GL /Gy /utf-8 /W4 /WX- /wd4324 /I. /I..\include ^
            /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DSTBI_WINDOWS_UTF8 /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
            /Fe:"..\build\artpicst.exe" main.cpp ..\build\artpicst.res ^
            /link gdiplus.lib user32.lib kernel32.lib shell32.lib shlwapi.lib gdi32.lib msimg32.lib ^
                  ole32.lib oleaut32.lib uuid.lib dwmapi.lib windowscodecs.lib comdlg32.lib d2d1.lib dwrite.lib ^
                  advapi32.lib ^
            /MANIFEST:EMBED /MANIFESTINPUT:..\artpicst.manifest /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF || exit /b 1
          cd ..

      - name: Compilar updater (C++23, asInvoker)
        shell: cmd
        run: |
          cd updater
          cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /utf-8 /W4 /WX- /wd4324 /I. /I..\installer ^
            /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
            /Fe:"..\build\artpicst_updater.exe" artpicst_updater.cpp ..\build\artpicst_updater.res ^
            /link winhttp.lib gdiplus.lib shell32.lib shlwapi.lib user32.lib advapi32.lib ^
                  gdi32.lib ole32.lib uuid.lib dwmapi.lib ^
            /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF || exit /b 1
          cd ..

      # Gate de calidad. Se captura la salida a un fichero y se muestra
      # SIEMPRE (éxito o fallo): el binario es /SUBSYSTEM:WINDOWS y un crash
      # temprano (p. ej. el OOB del fuzzer interno corregido en el run #77)
      # moría sin dejar rastro en el log, dejando el gate ciego. `|| exit /b 1`
      # además enmascaraba el código real a 1; aquí se preserva el código en
      # el mensaje ::error:: y se normaliza a 1 para el fallo del step.
      - name: Validar updater (selftest como gate de calidad)
        shell: cmd
        run: |
          REM Sin bloque ( ... ): los parentesis del mensaje rompian el parseo
          REM de cmd (". was unexpected at this time.") y el step moria con 255
          REM aunque el selftest hubiera pasado. Con goto el echo es una linea
          REM plana y los parentesis son literales.
          build\artpicst_updater.exe --selftest > selftest.log 2>&1
          set GATE_RC=%errorlevel%
          type selftest.log
          if %GATE_RC% equ 0 goto gate_ok
          echo ::error::Updater selftest FAILED con exit code %GATE_RC% (salida arriba; vacio = crash antes de escribir).
          exit /b 1
          :gate_ok
          echo Updater selftest OK.

      - name: Preparar payload autocontenido del instalador
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          python "$root\scripts\collect_app_payload.py" --root $root
          if ($LASTEXITCODE -ne 0) { throw "collect_app_payload.py failed" }

      - name: Compilar instalador autocontenido (C++23, requiere administrador)
        shell: cmd
        run: |
          cd installer
          rc /nologo /fo ..\build\artpicst_installer.res artpicst_installer.rc || exit /b 1
          cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /utf-8 /W4 /WX- /wd4324 /I. /I..\include ^
            /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
            /Fe:"..\build\artpicst_installer.exe" artpicst_installer.cpp ..\build\artpicst_installer.res ^
            /link gdiplus.lib shlwapi.lib shell32.lib comctl32.lib dwmapi.lib user32.lib advapi32.lib ^
                  gdi32.lib ole32.lib uuid.lib ^
            /SUBSYSTEM:WINDOWS "/MANIFESTUAC:level='requireAdministrator' uiAccess='false'" ^
            /OPT:REF /OPT:ICF || exit /b 1
          cd ..

      - name: Validar ejecutables
        shell: powershell
        run: |
          foreach ($exe in @("build\artpicst.exe", "build\artpicst_updater.exe", "build\artpicst_installer.exe")) {
            if (-not (Test-Path $exe)) { throw "Falta el ejecutable: $exe" }
            Write-Host "$exe : $((Get-Item $exe).Length) bytes"
          }
          $installerBytes = (Get-Item "build\artpicst_installer.exe").Length
          $minExpected = (Get-Item "build\artpicst.exe").Length + (Get-Item "build\artpicst_updater.exe").Length
          if ($installerBytes -le $minExpected) { throw "El instalador autocontenido parece incompleto ($installerBytes bytes <= $minExpected bytes esperados): falta el payload." }
          # AppendAllText UTF-8 sin BOM: el ">>" de PS 5.1 apenda UTF-16LE y
          # corrompe GITHUB_ENV si otro paso ya lo creo en UTF-8.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARTPICST_EXE=$(Resolve-Path build\artpicst.exe)`n", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARTPICST_INSTALLER=$(Resolve-Path build\artpicst_installer.exe)`n", $utf8)

      - name: Preparar carpeta de release
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $icon = Join-Path $root "resources\artpicst.ico"
          $tag = $env:ARTPICST_TAG

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          if (-not (Test-Path $icon)) { throw "Missing icon: $icon" }

          Copy-Item $env:ARTPICST_EXE (Join-Path $dist "artpicst.exe") -Force
          Copy-Item (Join-Path $root "build\artpicst_installer.exe") (Join-Path $dist "artpicst_installer.exe") -Force
          Copy-Item (Join-Path $root "build\artpicst_updater.exe") (Join-Path $dist "artpicst_updater.exe") -Force
          Copy-Item (Join-Path $root "README.md") (Join-Path $dist "README.md") -Force
          Copy-Item $icon (Join-Path $dist "artpicst.ico") -Force
          if (Test-Path (Join-Path $root "docs\REFACTOR_C23.md")) {
            Copy-Item (Join-Path $root "docs\REFACTOR_C23.md") (Join-Path $dist "REFACTOR_C23.md") -Force
          }

          $versionInfo = @{
            version = $tag
            tag = $tag
            build = [int]$env:GITHUB_RUN_NUMBER
            build_date = $env:ARTPICST_DATE
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dist "version.json") -Value $versionInfo -Encoding UTF8

      - name: Crear ZIP portable
        shell: powershell
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artpicst-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -DestinationPath $zipPath -Force

      - name: Publicar el instalador autocontenido como asset oficial
        shell: powershell
        run: |
          # El auto-updater descarga EXACTAMENTE este asset (artpicst-installer.exe).
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "build\artpicst_installer.exe") `
                    (Join-Path $env:GITHUB_WORKSPACE "artpicst-installer.exe") -Force
          Write-Host "Asset oficial: artpicst-installer.exe (wizard GDI+ autocontenido)"

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: artpicst-release
          path: |
            artpicst-installer.exe
            artpicst-portable.zip
          if-no-files-found: error

      - name: Generar changelog de la release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Changelog estandar para el auto-updater: se escribe en CHANGELOG.md
          # (queda en el repo si el paso de commit esta activo) y se usa como
          # body de la release. El updater lo lee del campo "body" del JSON de
          # la API - sincronizacion transparente app <-> GitHub Releases.
          $tag = $env:ARTPICST_TAG
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          $lines = @()
          $lines += "## $tag - $date"
          $lines += ""
          $lines += "### Cambios en esta build"
          $since = ""
          try { $since = git describe --tags --abbrev=0 --match "auto-*" 2>$null; } catch { }
          if (-not $since) { try { $since = git describe --tags --abbrev=0 2>$null; } catch { } }
          if ($since) {
            $log = git log --pretty="- %s (%h)" "$since..HEAD"
            if ($log) { $lines += $log } else { $lines += "- Build continuo sin cambios de codigo nuevos." }
          } else {
            $log = git log --pretty="- %s (%h)" -20
            if ($log) { $lines += $log } else { $lines += "- Primera build del esquema de versiones continuas." }
          }
          $lines += ""
          $lines += "### Notas"
          $lines += "- Instalador autocontenido (visor + updater + icono + docs)."
          $lines += "- El auto-updater compara SOLO dentro de su linea: estable (vX.Y.Z) o continua (auto-N-YYYYMMDD)."
          Set-Content -Path "CHANGELOG.md" -Value ($lines -join "`n") -Encoding UTF8
          # Mismo criterio: append UTF-8 sin BOM, nunca ">>" de PS 5.1.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARTPICST_BODY_FILE=$env:GITHUB_WORKSPACE\CHANGELOG.md`n", $utf8)

      - name: Publicar release en GitHub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.ARTPICST_TAG }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ARTPICST {0}', env.ARTPICST_TAG) }}
          body_path: ${{ env.ARTPICST_BODY_FILE }}
          files: |
            artpicst-installer.exe
            artpicst-portable.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Resumen
        shell: powershell
        run: |
          Write-Host "Release built successfully."
          Write-Host "Installer (asset oficial): artpicst-installer.exe"
          Write-Host "Portable: artpicst-portable.zip"
          Write-Host "Auto-updater: incluido dentro del instalador y en el ZIP portable."

name: Build ARTPICST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (MSVC x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    # El baseline SIMD (SSE4.2, sin AVX) NO se escribe en este workflow: se lee
    # de tools/build-baseline.json (unica fuente de verdad) y se publica como
    # variables de entorno para los pasos de compilacion. Si el JSON se degrada,
    # este paso falla en lugar de compilar con menos cobertura SIMD.
    - name: Baseline SIMD (fuente unica)
      shell: pwsh
      run: |
        $json = Get-Content tools/build-baseline.json -Raw | ConvertFrom-Json
        if ($json.simd.msvc_flag -notlike '*SSE4.2*') { throw "El baseline de tools/build-baseline.json no es SSE4.2" }
        "SIMD_FLAG=$($json.simd.msvc_flag)" >> $env:GITHUB_ENV
        "SIMD_DEFINE=/D$($json.simd.define)" >> $env:GITHUB_ENV
        Write-Host "Baseline SIMD: $($json.simd.msvc_flag) /D$($json.simd.define)"

    - name: Gate de consistencia del baseline (todos los pipelines)
      shell: pwsh
      run: ./tests/check_build_baseline.ps1 -Quiet

    # El .ico versionado ya es multirresolucion (16 a 256 px) y el generador no
    # necesita dependencias externas: esto comprueba que el script sigue
    # reproduciendo el icono en el CI y refresca el recurso antes de empaquetar.
    - name: Generar icono multirresolucion
      run: python scripts/generate_icon.py

    - name: Compilar recursos
      shell: cmd
      run: |
        if not exist build mkdir build
        rc /nologo /fo build\artpicst.res artpicst.rc || exit /b 1
        cd updater
        rc /nologo /fo ..\build\artpicst_updater.res artpicst_updater.rc || exit /b 1

    - name: Compilar ARTPICST (C++23)
      shell: cmd
      run: |
        if not exist build mkdir build
        if not exist dist mkdir dist
        cd src
        cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /GL /Gy /guard:cf %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /wd4324 /I. /I..\include ^
          /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DSTBI_WINDOWS_UTF8 /DSTBIR_NO_AVX /DSTBIR_NO_AVX2 /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
          /Fe:"..\build\artpicst.exe" main.cpp ..\build\artpicst.res ^
          /link gdiplus.lib user32.lib kernel32.lib shell32.lib shlwapi.lib gdi32.lib msimg32.lib ^
                ole32.lib oleaut32.lib uuid.lib dwmapi.lib windowscodecs.lib comdlg32.lib d2d1.lib dwrite.lib winmm.lib dxgi.lib ^
                advapi32.lib ^
          /MANIFEST:EMBED /MANIFESTINPUT:..\artpicst.manifest /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF ^
          /GUARD:CF /DYNAMICBASE /HIGHENTROPYVA /NXCOMPAT || exit /b 1
        cd ..

    - name: Compilar extension de shell (miniaturas y vista previa)
      shell: cmd
      run: |
        if not exist build mkdir build
        cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /guard:cf %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /wd4324 /Iinclude ^
          /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
          /LD /Fe:"build\artpicst_shell.dll" shell\artpicst_shell.cpp ^
          /link /DEF:shell\artpicst_shell.def shlwapi.lib windowscodecs.lib ole32.lib uuid.lib user32.lib ^
                gdi32.lib msimg32.lib advapi32.lib ^
          /OPT:REF /OPT:ICF /GUARD:CF /DYNAMICBASE /HIGHENTROPYVA /NXCOMPAT || exit /b 1

    # El updater es un binario propio (consulta WinHTTP, comparador de versiones
    # y SHA-256). Antes este workflow copiaba artpicst.exe con el nombre de
    # "artpicst_updater.exe" como placeholder: el instalador publicado desde CI
    # llevaba un auto-actualizador que NO era el updater. Ahora se compila de
    # verdad y su selftest actúa como gate antes de empaquetar.
    - name: Compilar y validar updater (C++23, asInvoker)
      shell: cmd
      run: |
        cd updater
        cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /guard:cf %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /wd4324 /I. /I..\installer ^
          /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
          /Fe:"..\build\artpicst_updater.exe" artpicst_updater.cpp ..\build\artpicst_updater.res ^
          /link winhttp.lib gdiplus.lib shell32.lib shlwapi.lib user32.lib advapi32.lib ^
                gdi32.lib ole32.lib uuid.lib dwmapi.lib ^
          /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /GUARD:CF /DYNAMICBASE /HIGHENTROPYVA /NXCOMPAT || exit /b 1
        cd ..
        build\artpicst_updater.exe --selftest || exit /b 1

    # collect_app_payload.py copia los cuatro binarios, el icono, version.json y
    # README a resources/app/ y genera installer/payload_manifest.hpp con el
    # SHA-256 de cada archivo: el instalador verifica esos hashes contra los
    # recursos incrustados antes de extraer nada a disco.
    - name: Preparar payload del instalador
      shell: powershell
      run: |
        $root = $env:GITHUB_WORKSPACE
        python "$root\scripts\collect_app_payload.py" --root $root
        if ($LASTEXITCODE -ne 0) { throw "collect_app_payload.py failed" }

    - name: Compilar recursos del instalador
      shell: cmd
      run: |
        cd installer
        rc /nologo /fo ..\build\artpicst_installer.res artpicst_installer.rc || exit /b 1

    - name: Compilar instalador (C++23, requiere administrador)
      shell: cmd
      run: |
        cd installer
        cl /nologo /EHsc /std:c++latest /O2 /Ob3 /Oi /guard:cf %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /wd4324 /I. /I..\include ^
          /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /D_CRT_SECURE_NO_WARNINGS ^
          /Fe:"..\build\artpicst_installer.exe" artpicst_installer.cpp ..\build\artpicst_installer.res ^
          /link gdiplus.lib shlwapi.lib shell32.lib comctl32.lib dwmapi.lib user32.lib advapi32.lib ^
                gdi32.lib ole32.lib uuid.lib ^
          /SUBSYSTEM:WINDOWS "/MANIFESTUAC:level='requireAdministrator' uiAccess='false'" ^
          /OPT:REF /OPT:ICF || exit /b 1
        cd ..

    - name: Compilar y ejecutar tests del núcleo de imagen
      shell: cmd
      run: |
        if not exist build mkdir build
        cl /nologo /EHsc /std:c++20 /O2 %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /permissive- /I. ^
          /Fe:"build\image_core_test.exe" tests\image_core_test.cpp /link kernel32.lib || exit /b 1
        build\image_core_test.exe || exit /b 1

    - name: Banco de kernels y gate de politica SIMD
      shell: cmd
      run: |
        cl /nologo /EHsc /std:c++20 /O2 %SIMD_FLAG% %SIMD_DEFINE% /utf-8 /W4 /WX- /permissive- /I. ^
          /Fe:"build\kernel_bench.exe" tests\kernel_bench.cpp /link kernel32.lib || exit /b 1
        python tests\check_simd_policy.py --root . || exit /b 1

    - name: Banco de kernels (informativo)
      shell: cmd
      run: |
        build\kernel_bench.exe

    - name: Compilar y ejecutar fuzzer del parser JSON
      shell: cmd
      run: |
        cl /nologo /EHsc /std:c++20 /O2 /utf-8 /W4 /WX- /permissive- /I. ^
          /Fe:"build\release_json_fuzzer.exe" tests\release_json_fuzzer.cpp /link kernel32.lib || exit /b 1
        build\release_json_fuzzer.exe 20000 || exit /b 1

    - name: Compilar y ejecutar tests EXIF
      shell: cmd
      run: |
        cl /nologo /EHsc /std:c++20 /O2 /utf-8 /W4 /WX- /permissive- /I. ^
          /Fe:"build\jpeg_exif_test.exe" tests\jpeg_exif_test.cpp /link kernel32.lib shell32.lib || exit /b 1
        build\jpeg_exif_test.exe || exit /b 1

    - name: Verificar artefactos
      shell: powershell
      run: |
        foreach ($exe in @("build\artpicst.exe", "build\artpicst_installer.exe")) {
          if (-not (Test-Path $exe)) { throw "Falta el ejecutable: $exe" }
          Write-Host "$exe : $((Get-Item $exe).Length) bytes"
        }

    - name: Copiar a dist
      shell: cmd
      run: |
        copy /y build\artpicst.exe dist\artpicst.exe >nul
        copy /y build\artpicst_installer.exe dist\artpicst_installer.exe >nul
        copy /y resources\artpicst.ico dist\artpicst.ico >nul
        copy /y version.json dist\version.json >nul
        copy /y README.md dist\README.md >nul
        if exist docs\REFACTOR_C23.md copy /y docs\REFACTOR_C23.md dist\REFACTOR_C23.md >nul

    - name: Subir artefactos
      uses: actions/upload-artifact@v7
      with:
        name: ARTPICST-Windows
        path: dist/*
        if-no-files-found: error

    - name: Crear zip de release
      if: github.event_name == 'release'
      shell: cmd
      run: |
        cd dist
        7z a ../ARTPICST-windows-x64.zip *
        cd ..

    - name: Publicar release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/artpicst_installer.exe
          ARTPICST-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

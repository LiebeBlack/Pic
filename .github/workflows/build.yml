name: Build ARTPICST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build ARTPICST
      run: |
        mkdir build
        mkdir dist
        
        # Build main program
        cd src
        cl /nologo /EHsc /std:c++17 /O2 /utf-8 /W4 /I. /I..\include /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DSTBI_WINDOWS_UTF8 /D_WIN32_WINNT=0x0601 /Fe:"..\build\artpicst.exe" main.cpp /link gdiplus.lib user32.lib kernel32.lib shell32.lib shlwapi.lib gdi32.lib msimg32.lib ole32.lib oleaut32.lib uuid.lib dwmapi.lib windowscodecs.lib comdlg32.lib /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF
        cd ..
        
        # Build installer
        cd installer
        cl /nologo /EHsc /std:c++17 /O2 /utf-8 /W4 /I. /I..\include /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /Fe:"..\build\artpicst_installer.exe" artpicst_installer.cpp /link gdiplus.lib shlwapi.lib shell32.lib comctl32.lib dwmapi.lib user32.lib advapi32.lib gdi32.lib /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF
        cd ..
        
        # Build updater (simple version without COM dependencies)
        cd updater
        cl /nologo /EHsc /std:c++17 /O2 /utf-8 /W4 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0601 /Fe:"..\build\auto_updater.exe" auto_updater_simple.cpp /link winhttp.lib shlwapi.lib shell32.lib user32.lib advapi32.lib /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF
        cd ..
    
    - name: Copy files to dist
      run: |
        copy build\artpicst.exe dist\artpicst.exe
        copy build\artpicst_installer.exe dist\artpicst_installer.exe
        copy build\auto_updater.exe dist\auto_updater.exe
        copy resources\artpicst.ico dist\artpicst.ico
        copy version.json dist\version.json
        
        # Create updater batch script
        echo @echo off > dist\auto_updater.bat
        echo setlocal EnableExtensions >> dist\auto_updater.bat
        echo cd /d "%%~dp0" >> dist\auto_updater.bat
        echo if exist "auto_updater.exe" start "" "auto_updater.exe" >> dist\auto_updater.bat
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ARTPICST-Windows
        path: dist/*
    
    - name: Create release zip
      if: github.event_name == 'release'
      run: |
        cd dist
        7z a ../artpicst-portable.zip *
        cd ..
    
    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/artpicst-installer.exe
          artpicst-portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}